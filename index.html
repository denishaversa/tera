<style>
/* Layout: journey rail on the left (Assess → Prioritize), working sheet on the right; collapses to a scrolling step strip on phones. */
/* Colors, type and radii come from the brand tokens block (v32) below. Light mode only. */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800} h2{font-size:1.2rem;font-weight:700} h3{font-size:1rem;font-weight:700}
p{margin:0} .muted{color:var(--muted)} .mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);padding-block:24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--f-body);font-weight:600;font-size:1.35rem;letter-spacing:-.01em;color:var(--ink)}
.mod{display:flex;flex-direction:column;gap:2px}
.mod-h{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-bottom:4px}
.navbtn{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--ink)}
.navbtn:hover{background:var(--sunk)}
.navbtn[aria-current="step"]{background:var(--accent-soft);font-weight:600}
.navbtn .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);width:20px}
.navbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--line);margin-left:auto;flex:none}
.navbtn .dot.done{background:var(--accent)}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.8rem}
main{padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.sheet{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:.85rem}
.banner b{font-weight:600}
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600}
.lede{color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500;text-decoration:underline;text-underline-offset:2px}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.5}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.t-verified{background:var(--ok-bg);color:var(--ok)} .t-confirmed{background:var(--info-bg);color:var(--info)}
.t-unverified{background:var(--neutral-bg);color:var(--neutral)} .t-estimated{background:var(--warn-bg);color:var(--warn)}
.t-missing{background:var(--bad-bg);color:var(--bad)} .t-conflicting{background:var(--conf-bg);color:var(--conf)}
.t-sim{background:var(--warn-bg);color:var(--warn)} .t-user{background:var(--info-bg);color:var(--info)}
.t-hard{background:var(--bad);color:var(--surface)}
.t-ai{background:var(--accent-soft);color:var(--accent)}
.t-req{background:var(--info);color:var(--surface)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.find a{color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
.find{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:0}
.src{font-size:.78rem;color:var(--muted)}
.progress{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.ready{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.rl{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rl .st{font-weight:600;font-size:.85rem}
.st.go{color:var(--ok)} .st.lim{color:var(--warn)} .st.no{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.blocked{border-color:var(--bad)}
.card ul{margin:0;padding-left:18px;font-size:.86rem;display:flex;flex-direction:column;gap:3px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 12px;font-size:.86rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-size:.88rem;text-align:left}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
details.cons{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.cons>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details.cons>summary::-webkit-details-marker{display:none}
details.cons>summary::before{content:"+";font-family:var(--f-mono);color:var(--muted);width:12px}
details.cons[open]>summary::before{content:"−"}
details.cons .body{padding:0 14px 14px 38px;display:flex;flex-direction:column;gap:10px;font-size:.88rem}
.score{font-family:var(--f-mono);font-weight:500;padding:2px 10px;border-radius:6px;background:var(--sunk);font-size:.85rem;white-space:nowrap}
.score.ns{background:var(--bad-bg);color:var(--bad)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:10px;height:10px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--accent)}
.formula{font-family:var(--f-mono);font-size:.8rem;background:var(--sunk);padding:8px 10px;border-radius:6px;overflow-x:auto;white-space:pre}
.note{font-size:.82rem;color:var(--muted)}
.alert{border-left:4px solid var(--bad);background:var(--bad-bg);color:var(--bad);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.88rem}
.okmsg{border-left:4px solid var(--ok);background:var(--ok-bg);color:var(--ok);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.88rem}
.infomsg{border-left:4px solid var(--info);background:var(--info-bg);color:var(--info);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.88rem}
.matrix{width:100%;min-width:640px;border-collapse:separate;border-spacing:0}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:12px}
.matrix thead th{text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--ink);font-family:var(--f-display);vertical-align:bottom}
.matrix tbody th{width:170px;font-size:.78rem}
.matrix td{width:calc((100% - 170px)/3)}
.cellv{display:flex;flex-direction:column;gap:4px}
.big{font-family:var(--f-mono);font-size:1.4rem;font-weight:500}
.rank{display:inline-block;font-family:var(--f-mono);font-size:.75rem;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 6px}
.slider{display:grid;grid-template-columns:150px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:.88rem}
.slider input{width:100%;accent-color:var(--accent)}
.short{display:flex;flex-direction:column;gap:10px}
.sitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface)}
.sitem.pref{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bcsec{display:flex;flex-direction:column;gap:6px}
.bcsec h3{font-size:.95rem}
.sumstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--sunk);border-radius:8px;padding:12px}
.sumstrip>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
details.more>summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:500}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:" ▾"}
details.more[open]>summary::after{content:" ▴"}
.bcp{line-height:1.65;max-width:72ch}
.bcp mark{border-radius:4px;padding:0 5px;font-size:.78rem;font-weight:600}
.m-obs{background:var(--ok-bg);color:var(--ok)} .m-est{background:var(--warn-bg);color:var(--warn)} .m-asm{background:var(--neutral-bg);color:var(--neutral)} .m-gap{background:var(--bad-bg);color:var(--bad)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem}
.footer-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));gap:12px}
  .navwrap{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px}
  .mod{flex:none}
  .railfoot{flex-direction:row;flex-wrap:wrap}
  .kv{grid-template-columns:1fr}
  .slider{grid-template-columns:1fr 52px}
  .slider span:first-child{grid-column:1/-1}
  .sitem{grid-template-columns:auto minmax(0,1fr)}
  .sitem>:last-child{grid-column:1/-1}
}
/* Welcome screen (v22): shown before Start; the journey rail is hidden here. */
.app.solo{grid-template-columns:1fr} .app.solo .rail{display:none}
.wel{display:flex;flex-direction:column;gap:22px;max-width:920px;margin:0 auto;width:100%}
.wel .wmark{font-family:var(--f-body);font-weight:600;font-size:1.35rem;letter-spacing:-.01em}
.wel h1{font-size:2.1rem;line-height:1.2;max-width:22ch}
.wel .lede{font-size:1.05rem}
.offer{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.offer .card{gap:8px}
.offer .card .k{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);font-weight:500}
.offer .card p{font-size:.9rem;color:var(--muted)}
.stepstrip{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.85rem;color:var(--muted)}
.stepstrip span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink)}
.stepstrip span b{font-family:var(--f-mono);font-weight:500;color:var(--accent);margin-right:6px}
.ready-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.wcta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wcta .btn{padding:10px 18px}
.brandbtn{border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left}
/* Visual summaries (v25) */
.dbar{position:relative;height:10px;background:var(--sunk);border-radius:5px;margin:6px 0 2px}
.dbar i{position:absolute;top:0;bottom:0}
.dbar .db-base{left:0;background:var(--border-control);border-radius:5px 0 0 5px}
.dbar .db-add{background:var(--accent)}
.dbar .db-tgt{top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.dleg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.74rem;color:var(--muted)}
.dleg span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.dleg .sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.dleg .sw.b{background:var(--border-control)} .dleg .sw.a{background:var(--accent)} .dleg .sw.t{width:2px;height:10px;background:var(--ink);border-radius:1px}
.dtag{font-size:.74rem;font-weight:600}
.dtag.ok{color:var(--ok)} .dtag.short{color:var(--warn)}
.tradeoffs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cbars{display:grid;grid-template-columns:minmax(150px,auto) minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:.86rem}
.cbars .bar{height:14px;border-radius:4px}
.cbars .bar.disp{background:var(--border-control)} .cbars .bar.lost{background:var(--warn)}
.hcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:0 8px 8px 0;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
/* v27: hierarchy ladder, stream bars, payback timeline, issue chips */
.ladder{display:flex;gap:2px;font-size:.66rem;font-weight:600;letter-spacing:.02em}
.ladder span{padding:2px 7px;background:var(--sunk);color:var(--muted)}
.ladder span:first-child{border-radius:999px 0 0 999px} .ladder span:last-child{border-radius:0 999px 999px 0}
.ladder span.on{background:var(--accent);color:var(--accent-ink)}
.sbars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:.8rem;color:var(--muted)}
.sbars .bar{height:8px;border-radius:3px;background:var(--accent);opacity:.75}
.sbars .bar.none{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);opacity:1}
.ptl{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.ptl-line{position:relative;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.ptl-line i{position:absolute;top:0;bottom:0}
.ptl-line .back{left:0;background:var(--warn-bg);border-right:2px solid var(--warn)}
.ptl-line .earn{background:var(--ok-bg)}
.ptl-ax{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);font-family:var(--f-mono)}
.ptl-head{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;font-size:.82rem;color:var(--muted)}
.ptl-head b{font-family:var(--f-mono);font-size:1.15rem;color:var(--ink);font-weight:500;margin-right:4px}
.issues{display:flex;flex-wrap:wrap;gap:4px}
/* v28 polish: calmer surfaces, fewer hues, one typeface, sentence case */
:root{--ring:none}
h1{font-weight:600;letter-spacing:-.015em} h2{font-weight:600} h3{font-weight:600}
.mod-h,.eyebrow,th,.matrix tbody th{text-transform:none;letter-spacing:0}
.mod-h{font-size:.75rem;font-weight:500}
.eyebrow{font-size:.8rem;font-weight:500}
th{font-size:.8rem;font-weight:500}
.matrix tbody th{font-size:.82rem;color:var(--muted)}
.sheet{gap:28px}
.panel{border:0;box-shadow:var(--ring);border-radius:12px;padding:22px}
.card,.sitem{border:1px solid transparent;box-shadow:var(--ring);border-radius:12px}
.card.sel,.sitem.pref{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.blocked{border-color:var(--bad)}
.panel .card,.panel .sitem{box-shadow:none;border-color:var(--line)}
.panel .sitem.pref{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
details.cons{border:0;box-shadow:var(--ring);border-radius:10px}
.rl{border-color:transparent;background:var(--bg)}
.sumstrip{background:var(--bg)}
.matrix th,.matrix td{border-bottom-color:var(--sunk)}
.t-sim,.t-ai,.t-confirmed,.t-user{background:var(--neutral-bg);color:var(--neutral)}
.t-req{background:var(--warn-bg);color:var(--warn)}
.infomsg{border-left-color:var(--line);background:var(--bg);color:var(--ink)}
.hcard{box-shadow:var(--ring);border-top:0;border-right:0;border-bottom:0}
/* v31: landing page */
.app.solo main{padding-top:0}
.lp{max-width:1080px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:72px;padding-bottom:24px}
.lp-nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.lp-mark{font-weight:600;font-size:1.3rem;letter-spacing:-.01em}
.lp-navr{display:flex;gap:16px;align-items:center}
.lp-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center;margin-top:-24px}
.lp-copy{display:flex;flex-direction:column;gap:18px}
.lp h1{font-size:clamp(2.1rem,4.2vw,3.1rem);line-height:1.08;letter-spacing:-.025em;font-weight:600;max-width:16ch}
.lp-lede{font-size:1.1rem;color:var(--muted);max-width:46ch;line-height:1.6}
.lp-cta{display:flex;gap:10px;flex-wrap:wrap}
.lp-cta .btn{padding:11px 20px;font-size:.95rem}
.lp-status{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.lp-dot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.lp-dot.ok{background:var(--accent)}

.app.solo main{overflow-x:hidden}

/* v29: rail stepper and top-pick column */
:root{--top-bg:var(--green-100)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stepper{position:relative;display:flex;flex-direction:column;gap:2px}
.stepper::before,.stepper::after{content:"";position:absolute;left:11px;top:18px;width:2px;border-radius:1px}

.stepper::after{height:calc((100% - 36px) * var(--p));background:var(--accent)}
.stepper .navbtn{position:relative;padding:8px 8px 8px 30px;z-index:1}
.stepper .sd{position:absolute;left:7px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--surface);border:2px solid var(--line);box-sizing:border-box}
.stepper .navbtn.done .sd{background:var(--accent);border-color:var(--accent)}

/* ===== v32: Tera brand (tokens from tera-tokens.css, design system "Tera") ===== */
:root{
  --green-100:#E3F3EA; --green-200:#C3E3D1; --green-500:#287A56; --green-700:#1E5E42; --green-900:#0F2A1F;
  --yellow-100:#FDF3D6; --yellow-400:#F2C14E; --yellow-600:#B98309; --yellow-800:#8A6100;
  --bg:#F7F9F7; --surface:#FFFFFF; --surface-sunken:#EDF1EE; --border:#DDE3DF; --border-control:#7D8983;
  --ink:#1B2420; --ink-secondary:#4A5650; --ink-muted:#66726C; --on-green:#FFFFFF;
  --good-bg:#E3F3EA; --good-text:#1E5E42; --good-icon:#287A56;
  --attention-bg:#FCEBD9; --attention-text:#8A4300; --attention-icon:#C2620A;
  --blocked-bg:#FBE4E1; --blocked-text:#9A2B1E; --blocked-icon:#C23B2B;
  --focus-ring:0 0 0 2px var(--surface), 0 0 0 4px var(--green-500);
  --font-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --font-sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --text-display:700 56px/58px var(--font-display); --text-h1:700 36px/40px var(--font-display); --text-h2:700 24px/30px var(--font-display);
  --text-h3:600 18px/26px var(--font-sans); --text-body:400 15px/24px var(--font-sans); --text-small:400 13px/20px var(--font-sans);
  --text-label:600 12px/16px var(--font-sans); --text-metric:500 28px/36px var(--font-mono); --text-num:500 14px/20px var(--font-mono); --text-num-small:400 12px/16px var(--font-mono);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px; --space-16:64px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-pill:999px;
  /* the app's older variable names, pointed at brand tokens */
  --sunk:var(--surface-sunken); --muted:var(--ink-secondary); --line:var(--border);
  --accent:var(--green-500); --accent-ink:var(--on-green); --accent-soft:var(--green-100);
  --ok:var(--good-text); --ok-bg:var(--good-bg); --warn:var(--attention-text); --warn-bg:var(--attention-bg);
  --bad:var(--blocked-text); --bad-bg:var(--blocked-bg); --conf:var(--attention-text); --conf-bg:var(--attention-bg);
  --info:var(--ink-secondary); --info-bg:var(--surface-sunken); --neutral:var(--ink-secondary); --neutral-bg:var(--surface-sunken);
  --f-display:var(--font-display); --f-body:var(--font-sans); --f-mono:var(--font-mono);
  --ring:none; --top-bg:var(--green-100);
}

/* type */

.head h1{font:var(--text-h2);letter-spacing:-0.02em}

.t-missing,.t-hard{background:var(--blocked-bg);color:var(--blocked-text)} .t-missing::before,.t-hard::before{--ico:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%225.8%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%222.2%22/%3E%3Cpath%20d%3D%22M4%2012%2012%204%22%20stroke%3D%22%23000%22%20stroke-width%3D%222.2%22/%3E%3C/svg%3E");background:var(--blocked-icon)}
